name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Swift Package build and tests
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test --enable-code-coverage

  ios:
    name: iOS Swift Package build and cache tests
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift Package instead of legacy Pods project
        run: rm _Pods.xcodeproj
      - name: Build Swift Package for iOS Simulator
        run: |
          if ! xcodebuild build -scheme AxcBedrockCore \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO > ios-build.log 2>&1; then
            cat ios-build.log
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -E 'error:|failed' ios-build.log | tail -n 20)
            exit 1
          fi
          cat ios-build.log
      - name: Run cache regression tests
        run: |
          if ! xcodebuild test -scheme AxcBedrock-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -only-testing:AxcBedrockTests/AxcDiskCacheTests \
            -only-testing:AxcBedrockTests/AxcUIImageCacheTests > ios-test.log 2>&1; then
            cat ios-test.log
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -E 'error:|failed' ios-test.log | tail -n 20)
            exit 1
          fi
          cat ios-test.log

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: swiftlint lint --reporter github-actions-logging
