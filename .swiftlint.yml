included:
  - AxcBedrock/Classes

excluded:
  - Pods
  - .build
  - Example

disabled_rules:
  - trailing_comma
  - opening_brace
  - identifier_name
  - type_name
  - line_length
  - function_body_length
  - file_length
  - type_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - nesting

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - unowned_variable_capture
  - vertical_whitespace_closing_braces

force_cast: error
force_try: error
force_unwrapping: warning

reporter: "xcode"
